[package]
name = "docz"
version = "0.1.0"
edition = "2024"
description = "A personal terminal editor with gamer-style movement"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
